[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "warden-guard"
version = "0.1.0.dev0"
description = "A transaction firewall for LLM agents that hold wallets, and the WardenBench benchmark."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "David Huang" }]
dependencies = []  # pinned in requirements.txt; installed with `pip install -r requirements.txt`

[project.scripts]
warden = "warden.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/warden"]

[tool.hatch.build.targets.wheel.force-include]
"src/warden/storage/migrations" = "warden/storage/migrations"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "T20", "PT"]
ignore = [
  "S101",   # assert is fine in tests and for invariants documented as such
  "RUF001", "RUF002", "RUF003",  # typographic characters in strings/docstrings are intentional
  "PT018",  # composite assertions read fine in these tests
  "E501",   # the formatter owns line length; long strings and docstrings are allowed
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20", "PT011", "E501"]
"scripts/**" = ["T20", "S603", "S607"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["warden"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["eth_abi.*", "eth_account.*", "eth_utils.*", "sse_starlette.*", "yaml.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: needs a running anvil (docker compose up -d anvil)",
]
filterwarnings = ["error::DeprecationWarning:warden.*"]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "warden"

[[tool.importlinter.contracts]]
name = "Signer isolation: the signer never imports LLM, agent, bench or policy code"
type = "forbidden"
source_modules = ["warden.signer"]
forbidden_modules = ["warden.llm", "warden.agent", "warden.bench", "warden.policy"]

[[tool.importlinter.contracts]]
name = "Agent isolation: the agent never reaches the signer, approvals or policy internals"
type = "forbidden"
source_modules = ["warden.agent"]
forbidden_modules = ["warden.signer", "warden.approvals", "warden.policy"]

[[tool.importlinter.contracts]]
name = "Pure policy: policy evaluation never calls an LLM or the chain"
type = "forbidden"
source_modules = ["warden.policy"]
forbidden_modules = ["warden.llm", "warden.chain"]
