name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt && pip install -e .
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: lint-imports
      - run: pytest -q -m "not integration"

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: forge build
        working-directory: contracts
      - run: forge test
        working-directory: contracts
      - name: committed artifacts match the build
        run: python3 scripts/export_artifacts.py --check

  integration:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: pip install -r requirements.txt -r requirements-dev.txt && pip install -e .
      - name: start anvil
        run: |
          anvil --port 8545 --chain-id 31337 --hardfork prague --timestamp 1767225600 \
            --mnemonic "test test test test test test test test test test test junk" > anvil.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -X POST -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId"}' http://127.0.0.1:8545 && break; sleep 1; done
      - name: deployment reproduces the committed record
        run: warden chain deploy
      - run: warden secrets init
      - run: pytest -q -m integration
